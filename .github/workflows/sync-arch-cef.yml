name: Sync Arch cef

on:
  schedule:
    # Run daily at 06:00 UTC to check for Arch cef updates
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  # Required to dispatch aur.yml and build-vaapi.yml via gh workflow run.
  actions: write
  # Required to push validated sync commits directly to main.
  contents: write

concurrency:
  # Do not cancel an in-flight sync while it is pushing and dispatching builds.
  group: sync-arch-cef
  cancel-in-progress: false

jobs:
  check-and-update:
    name: Check for Arch cef update and sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get current package version
        id: current
        run: |
          source PKGBUILD
          {
            echo "pkgver=${pkgver}"
            echo "pkgrel=${pkgrel}"
            echo "_cef_commit=${_cef_commit}"
          } >> "$GITHUB_OUTPUT"
          echo "Current: cef-vaapi ${pkgver}-${pkgrel} (CEF commit ${_cef_commit})"

      - name: Check latest Arch cef package version
        id: upstream
        run: |
          upstream_srcinfo=$(curl -fsSL "https://gitlab.archlinux.org/archlinux/packaging/packages/cef/-/raw/main/.SRCINFO")
          upstream_pkgver=$(printf '%s\n' "$upstream_srcinfo" | awk -F' = ' '/^[[:space:]]*pkgver = / { print $2; exit }')
          upstream_pkgrel=$(printf '%s\n' "$upstream_srcinfo" | awk -F' = ' '/^[[:space:]]*pkgrel = / { print $2; exit }')

          test -n "$upstream_pkgver"
          test -n "$upstream_pkgrel"

          {
            echo "pkgver=${upstream_pkgver}"
            echo "pkgrel=${upstream_pkgrel}"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream: cef ${upstream_pkgver}-${upstream_pkgrel}"

      - name: Check if update is needed
        id: check
        run: |
          current="${{ steps.current.outputs.pkgver }}-${{ steps.current.outputs.pkgrel }}"
          upstream="${{ steps.upstream.outputs.pkgver }}-${{ steps.upstream.outputs.pkgrel }}"

          if [ "$current" = "$upstream" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "cef-vaapi is up to date (${current})"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "Update available: ${current} -> ${upstream}"
          fi

      - name: Run update-from-arch-cef.sh in Arch container
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$PWD:/work" \
            -w /work \
            archlinux:latest \
            bash -lc '
              set -euo pipefail

              pacman -Syu --noconfirm base-devel git python shadow

              # makepkg refuses to run as root; use the GitHub runner uid/gid.
              host_uid="${HOST_UID:?HOST_UID is required}"
              host_gid="${HOST_GID:?HOST_GID is required}"

              if [ "$host_uid" = "0" ]; then
                echo "Refusing to run update-from-arch-cef.sh as root" >&2
                exit 1
              fi

              if ! getent group "$host_gid" >/dev/null; then
                groupadd --gid "$host_gid" builder
              fi

              if ! getent passwd "$host_uid" >/dev/null; then
                useradd --uid "$host_uid" --gid "$host_gid" --create-home --shell /bin/bash builder
              fi

              builder_user=$(getent passwd "$host_uid" | cut -d: -f1)
              su "$builder_user" -c "cd /work && bash scripts/update-from-arch-cef.sh"
            '

      - name: Check PKGBUILD validity after update
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          bash -n scripts/update-from-arch-cef.sh
          bash -n PKGBUILD
          echo "PKGBUILD syntax OK"

      - name: Validate invariants after update
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          grep -q 'use_vaapi=true' PKGBUILD || { echo "FAIL: use_vaapi=true missing after update"; exit 1; }
          grep -q 'ffmpeg_branding="Chrome"' PKGBUILD || { echo "FAIL: ffmpeg_branding missing after update"; exit 1; }
          grep -q 'proprietary_codecs=true' PKGBUILD || { echo "FAIL: proprietary_codecs missing after update"; exit 1; }
          grep -q "conflicts=('cef')" PKGBUILD || { echo "FAIL: conflicts missing after update"; exit 1; }
          grep -q 'cef::git+https://github.com/chromiumembedded/cef.git' PKGBUILD || { echo "FAIL: source alias changed after update"; exit 1; }
          ! grep -q '^[[:space:]]*\[ffmpeg\]=ffmpeg' PKGBUILD || { echo "FAIL: system ffmpeg enabled after update"; exit 1; }
          ! grep -q '^[[:space:]]*replaces=' PKGBUILD || { echo "FAIL: replaces present after update"; exit 1; }
          echo "All invariants preserved"

      - name: Extract new package version
        id: newver
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          source PKGBUILD
          {
            echo "pkgver=${pkgver}"
            echo "pkgrel=${pkgrel}"
          } >> "$GITHUB_OUTPUT"
          echo "New: cef-vaapi ${pkgver}-${pkgrel}"

      - name: Commit synced package to main
        id: sync_commit
        if: steps.check.outputs.up_to_date == 'false'
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.pkgver }}-${{ steps.current.outputs.pkgrel }}
          NEW_VERSION: ${{ steps.newver.outputs.pkgver }}-${{ steps.newver.outputs.pkgrel }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No file changes after sync; nothing to commit"
            echo "did_commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO REUSE.toml
          git add -- '*.patch'
          git commit -m "sync: cef-vaapi ${CURRENT_VERSION} → ${NEW_VERSION}"
          git push origin HEAD:main
          echo "did_commit=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch publish and binary build workflows
        if: steps.sync_commit.outputs.did_commit == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.newver.outputs.pkgver }}-${{ steps.newver.outputs.pkgrel }}
        run: |
          set -euo pipefail

          gh workflow run aur.yml --ref main
          gh workflow run build-vaapi.yml --ref main
          echo "Dispatched source AUR publish and binary build workflows for cef-vaapi ${NEW_VERSION}"
